<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- AURA's cat on your desktop. While it travels, this transparent window
     covers the route and cat_stage.js animates the whole trip at full frame
     rate; while it rests next to the answer bubble, the window shrinks to
     just the cat. Click the cat to send it home. -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; inset: 0; pointer-events: none; }
  #props, .overlay { position: absolute; inset: 0; pointer-events: none; }
  #catwrap { position: absolute; left: 0; top: 0; width: 112px; height: 98px; will-change: transform;
    transform-origin: 56px 98px; pointer-events: auto; cursor: pointer; }
  .prop { position: absolute; will-change: transform; pointer-events: none;
    filter: drop-shadow(0 0 3px rgba(58,214,255,.55)); }
  .prop svg { display: block; overflow: visible; }
  .grow-up { transform-origin: bottom; transform: scaleY(0); }
  .poof { animation: poof .6s ease-out forwards; }
  @keyframes poof { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.4); } }
  .sparkle { animation: sparkle .7s ease-out forwards; }
  @keyframes sparkle { from { opacity: 1; transform: scale(.3) rotate(0); } to { opacity: 0; transform: scale(1.5) rotate(90deg); } }
  .flutter svg { animation: flutter .12s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes flutter { to { transform: scaleX(.3); } }
  .jet .flame { animation: flame .08s ease-in-out infinite alternate; transform-origin: 20px 38px; }
  @keyframes flame { to { transform: scaleY(1.45); } }
  .portal svg { animation: portal 1s linear infinite; }
  @keyframes portal { 50% { filter: drop-shadow(0 0 10px #a78bfa) brightness(1.4); } }
  .drop-in { animation: dropin .3s cubic-bezier(.3,1.5,.5,1); }
  @keyframes dropin { from { transform: translateY(-60px); opacity: 0; } }
  .quip { position: absolute; width: 112px; text-align: center; font: 700 13px 'Segoe UI', sans-serif; color: #04131c;
    pointer-events: none; animation: quip 1.4s ease-out forwards; }
  .quip { background: #e9fdff; border: 2px solid #3ad6ff; border-radius: 12px; padding: 4px 6px; width: auto; min-width: 60px;
    white-space: nowrap; box-shadow: 0 0 10px rgba(58,214,255,.5); }
  @keyframes quip { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
</style>
<script src="cat.js"></script>
</head>
<body>
<div id="stage"><div id="props"></div><div id="catwrap" title="Click me to send me home"></div></div>
<script src="cat_stage.js"></script>
</body>
</html>
