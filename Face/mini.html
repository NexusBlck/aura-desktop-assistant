<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Mini AURA: the small always-on-top window (see mini_window.py). -->
<script src="skins/skins.js"></script>
<style>
  :root { --cyan: #3ad6ff; --cyan-bright: #9ef3ff; --line: rgba(58,214,255,0.28); --text: #d6f6ff; --dim: #6f97a6;
    --amber: #ffb547; --violet: #a78bfa; --panel: #050c13; }   /* solid: the window is cut to the panel's shape, nothing should show through */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: 'Segoe UI', sans-serif; color: var(--text); }
  .panel { position: absolute; inset: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 0 8px rgba(58,214,255,0.16), inset 0 0 28px rgba(58,214,255,0.04);   /* glow must fade inside the window's 10px margin */ display: flex; flex-direction: column; overflow: hidden; }

  /* header (the drag handle) */
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 8px 12px; border-bottom: 1px solid rgba(58,214,255,0.12); cursor: move; }
  .orb { width: 30px; height: 30px; flex-shrink: 0; position: relative; }
  .orb i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--cyan); }
  .orb i:nth-child(2) { inset: 8px; background: var(--cyan-bright); border: 0; box-shadow: 0 0 10px var(--cyan); }
  .orb i:nth-child(1) { animation: breathe 3s ease-in-out infinite; }
  body.talking .orb i:nth-child(1) { animation: pulse .5s ease-in-out infinite; }
  body.thinking .orb i:nth-child(1) { border-color: var(--amber); border-style: dashed; animation: spin 1.2s linear infinite; }
  body.listening .orb i:nth-child(1) { border-color: #4ef0a3; animation: pulse .9s ease-in-out infinite; }
  body.listening .orb i:nth-child(2) { background: #4ef0a3; box-shadow: 0 0 12px #4ef0a3; }
  @keyframes breathe { 50% { transform: scale(1.08); opacity: .7; } }
  @keyframes pulse { 50% { transform: scale(1.25); opacity: .5; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; font: 800 14px 'Segoe UI'; letter-spacing: 4px; color: var(--cyan-bright); }
  .title span { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  .btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--dim);
    cursor: pointer; display: grid; place-items: center; padding: 0; transition: background .15s, color .15s; }
  .btn:hover { background: rgba(58,214,255,0.1); color: var(--cyan-bright); }
  .btn.on { color: var(--violet); background: rgba(167,139,250,0.12); border-color: rgba(167,139,250,0.4); }
  .btn svg { width: 16px; height: 16px; }

  /* chat log */
  .log { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .log::-webkit-scrollbar { width: 4px; } .log::-webkit-scrollbar-thumb { background: #1b5366; border-radius: 2px; }
  .msg { max-width: 86%; padding: 7px 11px; border-radius: 14px; font-size: 13px; line-height: 1.45; word-wrap: break-word; animation: in .2s ease-out; }
  .msg.aura { align-self: flex-start; background: rgba(58,214,255,0.08); border: 1px solid rgba(58,214,255,0.18); border-bottom-left-radius: 4px; }
  .msg.you { align-self: flex-end; background: var(--cyan); color: #02121c; font-weight: 500; border-bottom-right-radius: 4px; }
  .msg time { display: block; font-size: 10px; opacity: .55; margin-top: 2px; }
  .typing { align-self: flex-start; color: var(--dim); font-size: 12px; font-style: italic; display: none; }
  body.thinking .typing { display: block; }
  .empty { color: var(--dim); font-size: 12px; text-align: center; margin: auto; line-height: 1.6; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }

  /* next-up chips */
  .info { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
  .info:empty { display: none; }
  .chip { font-size: 11px; color: var(--text); background: rgba(58,214,255,0.07); border: 1px solid rgba(58,214,255,0.18);
    border-radius: 999px; padding: 3px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .chip.click { cursor: pointer; } .chip.click:hover { border-color: var(--cyan); color: var(--cyan-bright); }

  /* important-emails list (opens from the email chip) */
  .mail { position: absolute; left: 0; right: 0; top: 51px; bottom: 57px; background: #050c13; display: none; flex-direction: column; z-index: 2; }
  body.mail-open .mail { display: flex; }
  .mail-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
  .mail-head b { flex: 1; color: var(--cyan-bright); font-weight: 600; }
  .link { background: none; border: 0; color: var(--cyan); font: 12px 'Segoe UI'; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .link:hover { background: rgba(58,214,255,0.1); }
  .mail-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
  .mail-list::-webkit-scrollbar { width: 4px; } .mail-list::-webkit-scrollbar-thumb { background: #1b5366; border-radius: 2px; }
  .mail-item { display: flex; gap: 8px; align-items: flex-start; padding: 8px 8px 8px 10px; border-radius: 10px;
    background: rgba(58,214,255,0.06); border: 1px solid rgba(58,214,255,0.16); font-size: 12px; line-height: 1.4; transition: opacity .15s; }
  .mail-item div { flex: 1; min-width: 0; }
  .mail-item b { display: block; color: var(--text); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-item span { color: var(--dim); }
  .mail-item .btn { width: 24px; height: 24px; flex-shrink: 0; }

  /* input */
  .bar { display: flex; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid rgba(58,214,255,0.12); }
  #msg { flex: 1; min-width: 0; height: 36px; border-radius: 10px; border: 1px solid #1b5366; background: rgba(2,8,13,0.9);
    color: var(--text); font: 13px 'Segoe UI'; padding: 0 12px; outline: none; }
  #msg:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(58,214,255,0.25); }
  .send { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--cyan); color: #02121c; cursor: pointer; display: grid; place-items: center; }
  .send svg { width: 16px; height: 16px; }

  /* collapsed: just the orb */
  .bubble { position: absolute; inset: 12px; border-radius: 50%; display: none; cursor: pointer; background: radial-gradient(circle at 50% 45%, #0d2433, #02050a 70%);
    border: 1px solid var(--line); box-shadow: 0 0 8px rgba(58,214,255,0.3); }
  .bubble .orb { position: absolute; inset: 16px; width: auto; height: auto; }
  .badge { position: absolute; top: 6px; right: 6px;   /* top-right, still inside the orb's circle (the window is cut to it) */ min-width: 20px; height: 20px; border-radius: 10px; background: var(--amber); color: #1a0f00;
    font: 700 11px 'Segoe UI'; display: none; place-items: center; padding: 0 5px; }
  body.collapsed .panel { display: none; }
  body.collapsed .bubble { display: block; }
  body.collapsed.has-unread .badge { display: grid; }
</style>
</head>
<body>
<div class="panel">
  <div class="head pywebview-drag-region" title="Drag to move · Hold Ctrl and point at it to move it aside">
    <div class="orb"><i></i><i></i></div>
    <div class="title"><b>AURA</b><span id="status">Standing by</span></div>
    <button class="btn" id="dnd" title="Do not disturb - no announcements"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="btn" id="mic" title="Talk (Ctrl+Alt+A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="btn" id="big" title="Open the full AURA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <button class="btn" id="small" title="Shrink to an orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
  </div>
  <div class="log" id="log"><div class="empty" id="empty">Say "AURA", press Ctrl+Alt+A,<br>or type below.</div><div class="typing" id="typing">AURA is thinking…</div></div>
  <div class="mail" id="mail">
    <div class="mail-head"><b>Important emails</b><button class="link" id="mailAll" title="Stop reminding me about all of these">Dismiss all</button><button class="link" id="mailClose">Close</button></div>
    <div class="mail-list" id="mailList"></div>
  </div>
  <div class="info" id="info"></div>
  <div class="bar">
    <input id="msg" placeholder="Message AURA…" autocomplete="off" spellcheck="false">
    <button class="send" id="send" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>
<div class="bubble" id="bubble" title="Open Mini AURA"><div class="orb"><i></i><i></i></div><span class="badge" id="badge">0</span></div>

<script>
const $ = (id) => document.getElementById(id);
const api = () => (window.pywebview && window.pywebview.api) || null;
const log = $('log');
let unread = 0;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function fmtTime(t) { return new Date((t || Date.now() / 1000) * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

window.addLine = function (entry, quiet) {
  $('empty') && $('empty').remove();
  const m = el('div', 'msg ' + (entry.role === 'you' ? 'you' : 'aura'), entry.text);
  m.appendChild(el('time', null, fmtTime(entry.t)));
  log.insertBefore(m, $('typing'));
  while (log.querySelectorAll('.msg').length > 60) log.querySelector('.msg').remove();
  log.scrollTop = log.scrollHeight;
  if (!quiet && entry.role !== 'you' && document.body.classList.contains('collapsed')) {
    unread++; $('badge').textContent = unread; document.body.classList.add('has-unread');
  }
};

window.setStatus = function (s) {
  for (const k of ['talking', 'thinking', 'listening']) if (k in s) document.body.classList.toggle(k, !!s[k]);
  const b = document.body.classList;
  $('status').textContent = b.contains('talking') ? 'Speaking' : b.contains('thinking') ? 'Thinking…' : b.contains('listening') ? 'Listening…' : 'Standing by';
  if (b.contains('thinking')) log.scrollTop = log.scrollHeight;
};

window.setInfo = function (chips) {
  const box = $('info'); box.innerHTML = '';
  for (const c of chips || []) {
    const chip = el('span', 'chip' + (c.action ? ' click' : ''), `${c.icon} ${c.text}`);
    if (c.action === 'emails') { chip.title = "See them - dismiss the ones you've dealt with"; chip.onclick = openMail; }
    box.appendChild(chip);
  }
  if (document.body.classList.contains('mail-open') && !(chips || []).some(c => c.action === 'emails')) closeMail();
};

// The important-emails list: x on one = stop reminding me about it; "Dismiss all" = all of them.
function renderMail(list) {
  const box = $('mailList'); box.innerHTML = '';
  if (!list || !list.length) { closeMail(); return; }
  for (const m of list) {
    const row = el('div', 'mail-item');
    const txt = el('div');
    txt.appendChild(el('b', null, m.from));
    txt.appendChild(el('span', null, m.summary || m.subject));
    const x = el('button', 'btn');
    x.title = 'Dismiss - stop reminding me about this one';
    x.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    x.onclick = async () => { row.style.opacity = .4; renderMail(await api().dismiss_email(m.id)); };
    row.append(txt, x);
    box.appendChild(row);
  }
}
async function openMail() { if (!api()) return; document.body.classList.add('mail-open'); renderMail(await api().emails()); }
function closeMail() { document.body.classList.remove('mail-open'); }
$('mailClose').onclick = closeMail;
$('mailAll').onclick = async () => { if (api()) { await api().dismiss_all_emails(); closeMail(); } };

window.setCollapsed = function (c) {
  document.body.classList.toggle('collapsed', !!c);
  if (!c) { unread = 0; document.body.classList.remove('has-unread'); setTimeout(() => $('msg').focus(), 50); }
};

function send() {
  const t = $('msg').value.trim();
  if (!t || !api()) return;
  $('msg').value = '';
  api().send(t);
}
$('send').onclick = send;
$('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); if (e.key === 'Escape') api() && api().set_collapsed(true); });
$('mic').onclick = () => api() && api().talk();
$('big').onclick = () => api() && api().expand_hud();
$('small').onclick = () => api() && api().set_collapsed(true);
$('bubble').onclick = () => api() && api().set_collapsed(false);
$('dnd').onclick = async () => { if (!api()) return; const on = await api().toggle_dnd(); $('dnd').classList.toggle('on', !!on);
  $('dnd').title = on ? 'Do not disturb is ON - click to turn off' : 'Do not disturb - no announcements'; };

window.addEventListener('pywebviewready', async () => {
  const s = await api().init();
  for (const e of s.chat || []) window.addLine(e, true);
  window.setCollapsed(s.collapsed);
  $('dnd').classList.toggle('on', !!s.dnd);
});
</script>
</body>
</html>
